name: Verify
# A task branch is checked once, by its pull request; main by its pushes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    # 253: the players' `latest` release is published only by hand, with the
    # commit Rule 1 verified on an agent's machine as its input.
    inputs:
      commit:
        description: 'The commit to build and publish (empty: the branch head)'
        required: false
        default: ''
# A newer push to the same branch cancels the older run.
concurrency:
  group: verify-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  runs-size:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Full history without file contents: the check reads sizes only.
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: tools
      - run: python3 tools/check_runs_size.py origin/${{ github.base_ref }}
      - run: python3 tools/check_public_content.py origin/${{ github.base_ref }}
  windows-game:
    runs-on: windows-latest
    env:
      BUILD_COMMIT: ${{ inputs.commit || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          # runs/ holds only evidence: skip its hundreds of megabytes.
          sparse-checkout: |
            /*
            !/runs/
          sparse-checkout-cone-mode: false
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/configure-build.ps1 Release
      - run: ctest --test-dir build --output-on-failure
      - run: py -3 -m unittest discover -s tools/tour -p 'test*.py' -v
      - name: Stage the release payload
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item build/fallout2-ce.exe staging/
          Copy-Item build/fallout2-ce-3d-launcher.exe staging/
          build/ce-dat-tool.exe create ce/files/ce.dat staging/ce.dat
          Copy-Item ce/files/fallout2.cfg staging/
          # Named parameters: pwsh 7.6 silently swaps the positional path and
          # value of Set-Content when -NoNewline precedes them, writing a file
          # named after the value instead.
          Set-Content -Path staging/version.txt -Value $env:BUILD_COMMIT -Encoding ascii -NoNewline
      - uses: actions/upload-artifact@v4
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        with:
          name: game-win64
          path: staging/*
          retention-days: 1
  publish-latest:
    # The rolling `latest` release (task 091): the game, the default cfg, the
    # commit and the exporter as a standalone exe.  253: published only by a
    # manual dispatch with the commit Rule 1 verified as its input, never on
    # a plain push: CI cannot start the game, so an unchecked build must not
    # reach the players.  No game file and no scene data goes here: the
    # launcher makes the 3D data on the player's machine from their own game
    # files.
    if: github.event_name == 'workflow_dispatch'
    needs: windows-game
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUILD_COMMIT: ${{ inputs.commit || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.sha }}
          sparse-checkout: |
            /*
            !/runs/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/scene_export/requirements.txt pyinstaller
      - run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/scene_export/build_standalone.ps1
      - name: Smoke-test the standalone exporter
        run: build/exporter-standalone/scene-exporter.exe --help
      - uses: actions/download-artifact@v4
        with:
          name: game-win64
          path: staging
      - name: Add the standalone exporter to the payload
        run: Copy-Item build/exporter-standalone/scene-exporter.exe staging/
      - name: Add the wide menu, death and loading art
        # The owner's art is not in git; it lives in the fixed release "wide-art".
        run: |
          gh release download wide-art --repo $env:GITHUB_REPOSITORY --pattern wide-art.zip --dir .
          Expand-Archive -LiteralPath wide-art.zip -DestinationPath staging -Force
          if (-not (Test-Path staging/user-assets/fullscreen-20261028/wallpapers-selected/hires/menu/art__intrface__hr_mainmenu__d0_f0_21-9.png)) { throw "wide-art.zip has no menu art" }
      - name: Pack and update the latest release
        run: |
          Compress-Archive -Path staging/* -DestinationPath fallout2-ce-3d-win64.zip -Force
          # The launcher unpacks these six by name; a zip without any one of
          # them would install a half-broken game.  Check before uploading.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Join-Path (Get-Location) 'fallout2-ce-3d-win64.zip'))
          try {
            $names = $zip.Entries | ForEach-Object { $_.FullName } | Where-Object { $_ }
            $want = 'fallout2-ce.exe', 'fallout2-ce-3d-launcher.exe', 'ce.dat', 'fallout2.cfg', 'version.txt', 'scene-exporter.exe'
            $missing = @($want | Where-Object { $_ -notin $names })
            "zip contains: $($names -join ', ')"
            if ($missing.Count -gt 0) { throw "the release zip is missing: $($missing -join ', ')" }
          } finally {
            $zip.Dispose()
          }
          gh release view latest --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            gh release create latest --repo $env:GITHUB_REPOSITORY --target $env:BUILD_COMMIT `
              --title "Latest build" `
              --notes "Rolling build of main. Run Install-F2R.exe to install it onto your Fallout 2; afterwards start the game with Fallout 2 Reimagined.exe in the game folder; the launcher makes the 3D scene data from your own game files."
          }
          # The download players see; the zip keeps the launcher under its build name for the in-place update.
          Copy-Item staging/fallout2-ce-3d-launcher.exe Install-F2R.exe
          gh release upload latest fallout2-ce-3d-win64.zip staging/version.txt Install-F2R.exe --repo $env:GITHUB_REPOSITORY --clobber
          gh release delete-asset latest fallout2-ce-3d-launcher.exe --repo $env:GITHUB_REPOSITORY --yes 2>$null
          $global:LASTEXITCODE = 0
          # The release page shows the creation date, so the title carries the build day.
          gh release edit latest --repo $env:GITHUB_REPOSITORY --title "Latest build $((Get-Date).ToUniversalTime().ToString('yyyy-MM-dd'))" `
            --notes "Rolling build of main. Run Install-F2R.exe to install it onto your Fallout 2; afterwards start the game with Fallout 2 Reimagined.exe in the game folder; the launcher makes the 3D scene data from your own game files."
      - name: Mirror the release on the dist branch
        # Task 235: through some VPNs github.com/.../releases/download answers
        # 504 while raw.githubusercontent.com works, so the launcher's last
        # route reads these two files from an orphan branch.  One commit,
        # force-pushed, so history does not grow.  GitHub refuses files over
        # 100 MB; the zip is about 34 MB.
        run: |
          if ((Get-Item fallout2-ce-3d-win64.zip).Length -gt 90MB) { throw "the release zip is too big for the dist mirror" }
          $dist = Join-Path $env:RUNNER_TEMP 'dist'
          New-Item -ItemType Directory $dist | Out-Null
          Copy-Item fallout2-ce-3d-win64.zip, staging/version.txt $dist
          # Task 238: the official RPU Russian translation rides on the mirror
          # too (the owner's decision), with its release tag.  If RPU cannot
          # be reached, keep the previous dist copy; with neither, fail loudly.
          $rpu = Join-Path $env:RUNNER_TEMP 'rpu'
          New-Item -ItemType Directory $rpu | Out-Null
          $rpuRepo = 'BGforgeNet/Fallout2_Restoration_Project'
          $tag = (gh release view --repo $rpuRepo --json tagName --jq .tagName)
          if ($LASTEXITCODE -eq 0 -and $tag) {
            gh release download --repo $rpuRepo --pattern 'rpu_*_translations.zip' --dir $rpu --clobber
          }
          $rpuZip = Get-ChildItem $rpu -Filter 'rpu_*_translations.zip' | Select-Object -First 1
          if ($LASTEXITCODE -eq 0 -and $rpuZip) {
            Expand-Archive $rpuZip.FullName -DestinationPath (Join-Path $rpu 'x') -Force
            $dat = Get-ChildItem (Join-Path $rpu 'x') -Recurse -Filter rpu_russian.dat | Select-Object -First 1
            if (-not $dat) { throw "rpu_russian.dat is not in $($rpuZip.Name)" }
            Copy-Item $dat.FullName (Join-Path $dist 'rpu_russian.dat')
            Set-Content (Join-Path $dist 'rpu-version.txt') $tag -NoNewline
          } else {
            Write-Warning "RPU release download failed; keeping the previous dist copy"
            $raw = "https://raw.githubusercontent.com/$($env:GITHUB_REPOSITORY)/dist"
            foreach ($name in 'rpu_russian.dat', 'rpu-version.txt') {
              Invoke-WebRequest "$raw/$name" -OutFile (Join-Path $dist $name)
            }
          }
          if (-not (Test-Path (Join-Path $dist 'rpu_russian.dat')) -or (Get-Item (Join-Path $dist 'rpu_russian.dat')).Length -lt 1MB) {
            throw "the dist mirror has no usable rpu_russian.dat"
          }
          Set-Location $dist
          git init -q -b dist
          git config user.name github-actions
          git config user.email "$($env:GITHUB_ACTOR_ID)+$($env:GITHUB_ACTOR)@users.noreply.github.com"
          git add .
          git commit -q -m "dist $env:GITHUB_SHA"
          git push -q --force "https://x-access-token:$($env:GH_TOKEN)@github.com/$($env:GITHUB_REPOSITORY).git" dist
  exporter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # runs/ holds only evidence: skip its hundreds of megabytes.
        with:
          sparse-checkout: |
            /*
            !/runs/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tools/scene_export/requirements.txt
      - run: python -m unittest discover -s tools/scene_export -p 'test*.py' -v
      - run: python -m unittest discover -s tools -p 'test_check_png_pixel.py' -v
      - run: python -m unittest discover -s tools/regression -p 'test*.py' -v
      - run: python -m unittest discover -s tools -p 'test_check_public_content.py' -v
  scene:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        suite: [ground_pick, preview_policy, sprite_card, game_view, map_clip, embedded_fonts, fixed_screen_options, snapshot_rows, settings_3d, sun, text_layer]
    steps:
      - uses: actions/checkout@v4
        # runs/ holds only evidence: skip its hundreds of megabytes.
        with:
          sparse-checkout: |
            /*
            !/runs/
          sparse-checkout-cone-mode: false
      - run: cmake -S ce/tests/${{ matrix.suite }} -B build-tests -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-tests --target settings_3d_tests
        if: matrix.suite == 'settings_3d'
      - run: cmake --build build-tests
        if: matrix.suite != 'settings_3d'
      - run: ctest --test-dir build-tests -R '^settings_3d_tests$' --output-on-failure
        if: matrix.suite == 'settings_3d'
      - run: ctest --test-dir build-tests --output-on-failure
        if: matrix.suite != 'settings_3d'
